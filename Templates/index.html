<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Depression Prediction</title>
</head>

<body>

    <h1>Student Depression Prediction</h1>

    <p>
        Enter the student's information to obtain a prediction.
    </p>

    <form action="/predict" method="POST">

        <!-- Gender -->
        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="0">Female</option>
            <option value="1">Male</option>
        </select>

        <br><br>

        <!-- Age -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age">

        <br><br>

        <!-- Profession -->
        <label for="profession">Profession:</label>
        <input type="text" id="profession" name="profession">

        <br><br>

        <!-- Academic Pressure -->
        <label for="academic_pressure">Academic Pressure:</label>
        <input type="number" id="academic_pressure" name="academic_pressure">

        <br><br>

        <!-- Work Pressure -->
        <label for="work_pressure">Work Pressure:</label>
        <input type="number" id="work_pressure" name="work_pressure">

        <br><br>

        <!-- CGPA -->
        <label for="cgpa">CGPA:</label>
        <input type="number" step="0.01" id="cgpa" name="cgpa">

        <br><br>

        <!-- Study Satisfaction -->
        <label for="study_satisfaction">Study Satisfaction:</label>
        <input type="number" id="study_satisfaction" name="study_satisfaction">

        <br><br>

        <!-- Job Satisfaction -->
        <label for="job_satisfaction">Job Satisfaction:</label>
        <input type="number" id="job_satisfaction" name="job_satisfaction">

        <br><br>

        <!-- Sleep Duration -->
        <label for="sleep_duration">Sleep Duration:</label>
        <input type="text" id="sleep_duration" name="sleep_duration">

        <br><br>

        <!-- Dietary Habits -->
        <label for="dietary_habits">Dietary Habits:</label>
        <input type="text" id="dietary_habits" name="dietary_habits">

        <br><br>

        <!-- Degree -->
        <label for="degree">Degree:</label>
        <input type="text" id="degree" name="degree">

        <br><br>

        <!-- Suicidal thoughts -->
        <label for="suicidal_thoughts">
            Have you ever had suicidal thoughts?
        </label>

        <select id="suicidal_thoughts" name="suicidal_thoughts">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <br><br>

        <!-- Work/Study Hours -->
        <label for="work_study_hours">Work/Study Hours:</label>
        <input type="number" id="work_study_hours" name="work_study_hours">

        <br><br>

        <!-- Financial Stress -->
        <label for="financial_stress">Financial Stress:</label>
        <input type="number" id="financial_stress" name="financial_stress">

        <br><br>

        <!-- Family History -->
        <label for="family_history">
            Family History of Mental Illness:
        </label>

        <select id="family_history" name="family_history">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <br><br>

        <button type="submit">Predict</button>

    </form>

</body>

</html>
